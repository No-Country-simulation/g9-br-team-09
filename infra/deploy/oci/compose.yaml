name: energiai-oci

services:
  backend:
    image: ${BACKEND_IMAGE:?Defina BACKEND_IMAGE com uma tag imutavel}
    platform: linux/amd64
    container_name: energiai-backend
    restart: unless-stopped
    init: true
    env_file:
      - ${BACKEND_ENV_FILE:-/opt/energiai/config/backend.env}
    environment:
      SPRING_PROFILES_ACTIVE: oci
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - energiai
    mem_limit: 640m
    cpus: "0.75"
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  caddy:
    image: caddy:2.11.4-alpine
    platform: linux/amd64
    container_name: energiai-caddy
    restart: unless-stopped
    init: true
    environment:
      API_PUBLIC_HOSTNAME: ${API_PUBLIC_HOSTNAME:?Define API_PUBLIC_HOSTNAME with the public API hostname}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - energiai
    mem_limit: 96m
    cpus: "0.20"
    pids_limit: 64
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

networks:
  energiai:
    name: energiai-oci
    driver: bridge

volumes:
  caddy_data:
    name: energiai-caddy-data
  caddy_config:
    name: energiai-caddy-config
