name: Backend Docker

on:
  pull_request:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"

  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: pxs00/energiai-backend
      CI_IMAGE: energiai-backend:ci-${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.CI_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name energiai-backend-ci \
            -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=local \
            "${CI_IMAGE}"

          if ! response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 20 \
              --retry-delay 3 \
              --retry-connrefused \
              --retry-all-errors \
              http://localhost:8080/api/v1/actuator/health
          )"; then
            docker logs energiai-backend-ci
            exit 1
          fi

          printf '%s\n' "${response}"

          if ! python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          sys.exit(0 if payload.get("status") == "UP" else 1)
          ' <<< "${response}"; then
            docker logs energiai-backend-ci
            exit 1
          fi

      - name: Remove smoke test container
        if: always()
        run: docker rm -f energiai-backend-ci 2>/dev/null || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish validated Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          develop_tag="${IMAGE_NAME}:develop"
          commit_tag="${IMAGE_NAME}:sha-${short_sha}"

          docker tag "${CI_IMAGE}" "${develop_tag}"
          docker tag "${CI_IMAGE}" "${commit_tag}"

          docker push "${develop_tag}"
          docker push "${commit_tag}"
