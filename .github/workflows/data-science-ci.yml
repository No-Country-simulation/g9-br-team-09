name: Data Science CI

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "data-science/**"
      - ".github/workflows/data-science-ci.yml"

permissions:
  contents: read

concurrency:
  group: data-science-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  data-science-ci:
    name: data-science-ci
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: data-science

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-science/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest
