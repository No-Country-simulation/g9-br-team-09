spring.application.name=energiai
server.servlet.context-path=/api/v1
spring.web.error.include-stacktrace=NEVER
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
energy.tariff.default=0.75
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
ml.api.base-url=${ML_API_BASE_URL:http://localhost:8000}
ml.api.connect-timeout=${ML_API_CONNECT_TIMEOUT:2s}
ml.api.read-timeout=${ML_API_READ_TIMEOUT:5s}
jwt.secret=${JWT_SECRET:}
jwt.issuer=${JWT_ISSUER:energiai-api}
jwt.audience=${JWT_AUDIENCE:energiai-frontend}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:15m}
auth.refresh.token-expiration=${AUTH_REFRESH_TOKEN_EXPIRATION:604800}
auth.refresh.family-expiration=${AUTH_REFRESH_FAMILY_EXPIRATION:2592000}
auth.refresh.reuse-grace-period=${AUTH_REFRESH_REUSE_GRACE_PERIOD:5}
auth.refresh.cookie-name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}
auth.refresh.cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:true}
auth.refresh.cookie-same-site=${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
auth.refresh.cookie-path=${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
auth.refresh.cookie-domain=${AUTH_REFRESH_COOKIE_DOMAIN:}
